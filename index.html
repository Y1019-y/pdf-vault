<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的 PDF</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1 class="title">📄 我的 PDF</h1>
    <input type="search" id="search" class="search" placeholder="搜索 PDF…">
    <div class="topbar-actions">
      <button id="btn-export" class="btn">导出备份</button>
      <button id="btn-import" class="btn btn-primary">导入备份</button>
    </div>
  </header>

  <main class="main">
    <div id="grid" class="grid"></div>
    <div id="empty" class="empty hidden">
      <div class="empty-icon">📄</div>
      <p id="empty-title" class="empty-title">把 PDF 拖到这里保存</p>
      <p id="empty-hint" class="empty-hint">也可以按 Ctrl+V 粘贴剪贴板中的文件</p>
    </div>
  </main>

  <div id="drop-overlay" class="drop-overlay hidden">
    <div class="drop-box">松开鼠标，保存 PDF</div>
  </div>

  <div id="viewer" class="viewer hidden">
    <div class="viewer-bar">
      <span id="viewer-name" class="viewer-name"></span>
      <div class="viewer-actions">
        <button id="viewer-download" class="viewer-btn">下载</button>
        <button id="viewer-copy" class="viewer-btn">复制</button>
        <button id="viewer-rename" class="viewer-btn">重命名</button>
        <button id="viewer-delete" class="viewer-btn danger">删除</button>
        <button id="viewer-close" class="viewer-btn">关闭</button>
      </div>
    </div>
    <iframe id="viewer-frame" class="viewer-frame" title="PDF 查看器"></iframe>
  </div>

  <div id="confirm" class="modal hidden">
    <div class="modal-box">
      <p id="confirm-text" class="modal-text"></p>
      <div class="modal-buttons">
        <button id="confirm-cancel" class="btn">取消</button>
        <button id="confirm-ok" class="btn btn-danger">删除</button>
      </div>
    </div>
  </div>

  <div id="rename" class="modal hidden">
    <div class="modal-box">
      <p class="modal-title">重命名</p>
      <input type="text" id="rename-input" class="rename-input" spellcheck="false">
      <div class="modal-buttons">
        <button id="rename-cancel" class="btn">取消</button>
        <button id="rename-ok" class="btn btn-primary">确定</button>
      </div>
    </div>
  </div>

  <input type="file" id="import-input" accept=".json,application/json" hidden>
  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
